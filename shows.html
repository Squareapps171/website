<main>

<header class="page-head">
  <img class="mark" src="images/logo.svg" alt="" width="64" height="66">
  <h1>Shows &amp; events</h1>
  <p class="muted" style="margin:0 auto">Here are a few examples from past shows and events we've done. Take your time, and let us know if you have any questions.</p>
</header>
<div id="gallery" class="gallery" aria-label="Photos from past shows"></div>
<div id="empty" class="empty" hidden>Photos from our past shows are coming soon.</div>
<p style="text-align:center;padding-bottom:44px"><a class="btn" href="index.html#contact">Contact us about your event</a></p>
<dialog id="viewer" aria-label="Photo">
  <button class="close" type="button" aria-label="Close" onclick="document.getElementById('viewer').close()">×</button>
  <img id="viewer-img" alt="">
  <p class="caption" id="viewer-caption"></p>
</dialog>

</main>
<footer>© <span id="year">2026</span> Square Digital · Los Angeles · <a href="tel:+18182727586">818-272-7586</a></footer>
<script>document.getElementById("year").textContent=new Date().getFullYear();</script>
<script>
/* To add a photo: put the file in images/shows/ and add a line below: { file: "name.jpg", caption: "Event name" } */
var photos = [
];
var gallery = document.getElementById("gallery"), viewer = document.getElementById("viewer");
if (photos.length === 0) { document.getElementById("empty").hidden = false; gallery.hidden = true; }
photos.forEach(function (p) {
  var b = document.createElement("button");
  b.type = "button";
  b.setAttribute("aria-label", "View larger: " + (p.caption || "photo"));
  var img = document.createElement("img");
  img.src = "images/shows/" + p.file; img.alt = p.caption || ""; img.loading = "lazy";
  b.appendChild(img);
  b.addEventListener("click", function () {
    document.getElementById("viewer-img").src = img.src;
    document.getElementById("viewer-img").alt = img.alt;
    document.getElementById("viewer-caption").textContent = p.caption || "";
    viewer.showModal();
  });
  gallery.appendChild(b);
});
viewer.addEventListener("click", function (e) { if (e.target === viewer) viewer.close(); });
</script>
</body>
</html>
